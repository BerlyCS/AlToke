name: CI

on:
  push:
    branches:
      - feature/devops
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      global: ${{ steps.detect.outputs.global }}
      frontend_affected: ${{ steps.detect.outputs.frontend_affected }}
      backend_affected: ${{ steps.detect.outputs.backend_affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          backend=false
          global=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            frontend=true
            backend=true
            global=true
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA")"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            fi

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                frontend/*|docker/nginx.Dockerfile|docker/nginx.conf)
                  frontend=true
                  ;;
                backend/*)
                  backend=true
                  ;;
                package.json|bun.lock|mise.toml|docker-compose.yml|.dockerignore|.github/workflows/ci.yml)
                  global=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          frontend_affected=$frontend
          backend_affected=$backend

          if [[ "$global" == "true" ]]; then
            frontend_affected=true
            backend_affected=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "global=$global" >> "$GITHUB_OUTPUT"
          echo "frontend_affected=$frontend_affected" >> "$GITHUB_OUTPUT"
          echo "backend_affected=$backend_affected" >> "$GITHUB_OUTPUT"

  validate-frontend:
    name: Validate frontend/nginx inputs
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run frontend:format:check

      - name: Check frontend linting
        run: bun run frontend:lint:check

      - name: Check frontend types
        run: bun run frontend:type-check

      - name: Run frontend tests
        run: bun run frontend:test

      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build

  validate-backend:
    name: Validate backend inputs
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Check backend formatting
        run: bun run backend:format:check

      - name: Check backend linting
        run: bun run backend:lint:check

      - name: Check backend types
        run: bun run backend:type-check

      - name: Run backend tests
        run: bun run backend:test

  build-backend-image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-backend
    if: needs.detect-changes.outputs.backend_affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image coordinates
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          ref_slug="${GITHUB_REF_NAME//\//-}"

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$ref_slug" >> "$GITHUB_OUTPUT"
          echo "source_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/${{ steps.prep.outputs.repo }}-backend
          tags: |
            type=raw,value=${{ steps.prep.outputs.ref_slug }}
            type=sha,prefix=${{ steps.prep.outputs.ref_slug }}-
          labels: |
            org.opencontainers.image.source=${{ steps.prep.outputs.source_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-nginx-image:
    name: Build and push nginx image
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-frontend
    if: needs.detect-changes.outputs.frontend_affected == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image coordinates
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          ref_slug="${GITHUB_REF_NAME//\//-}"

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$ref_slug" >> "$GITHUB_OUTPUT"
          echo "source_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate nginx image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/${{ steps.prep.outputs.repo }}-nginx
          tags: |
            type=raw,value=${{ steps.prep.outputs.ref_slug }}
            type=sha,prefix=${{ steps.prep.outputs.ref_slug }}-
          labels: |
            org.opencontainers.image.source=${{ steps.prep.outputs.source_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/nginx.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
