name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      deploy_branch: ${{ steps.resolve.outputs.deploy_branch }}
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Select branch deployment target
        id: resolve
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail

          should_deploy=false
          environment_name=""

          case "$HEAD_BRANCH" in
            feature/devops)
              should_deploy=true
              environment_name="devops"
              ;;
            dev)
              should_deploy=true
              environment_name="staging"
              ;;
            main)
              should_deploy=true
              environment_name="production"
              ;;
          esac

          echo "Branch '$HEAD_BRANCH' resolved to should_deploy=$should_deploy environment='${environment_name:-n/a}'"

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "deploy_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: resolve-target
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      needs.resolve-target.outputs.should_deploy == 'true'
    environment: ${{ needs.resolve-target.outputs.environment_name }}
    concurrency:
      group: cd-${{ needs.resolve-target.outputs.environment_name }}
      cancel-in-progress: false
    steps:
      - name: Resolve deploy path secret
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ needs.resolve-target.outputs.deploy_branch }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-target.outputs.environment_name }}
          DEVOPS_DEPLOY_PATH: ${{ secrets.DEVOPS_DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          deploy_path=""
          deploy_secret_name=""

          case "$DEPLOY_ENVIRONMENT" in
            devops)
              deploy_path="$DEVOPS_DEPLOY_PATH"
              deploy_secret_name="DEVOPS_DEPLOY_PATH"
              ;;
            staging)
              deploy_path="$STAGING_DEPLOY_PATH"
              deploy_secret_name="STAGING_DEPLOY_PATH"
              ;;
            production)
              deploy_path="$PROD_DEPLOY_PATH"
              deploy_secret_name="PROD_DEPLOY_PATH"
              ;;
            *)
              echo "Deployment target resolution failed: unsupported environment '$DEPLOY_ENVIRONMENT' for branch '$DEPLOY_BRANCH'." >&2
              exit 1
              ;;
          esac

          if [[ -z "$deploy_path" ]]; then
            echo "Deployment target resolution failed: repository secret '$deploy_secret_name' is empty or missing for branch '$DEPLOY_BRANCH'." >&2
            exit 1
          fi

          echo "DEPLOY_PATH=$deploy_path" >> "$GITHUB_ENV"
          echo "DEPLOY_SECRET_NAME=$deploy_secret_name" >> "$GITHUB_ENV"

      - name: Log deployment context
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying branch '${{ needs.resolve-target.outputs.deploy_branch }}' to environment '${{ needs.resolve-target.outputs.environment_name }}'."
          echo "Repository secret '$DEPLOY_SECRET_NAME' is configured."

      - name: Run remote deployment commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DEPLOY_PATH
          request_pty: false
          script: |
            bash -lc '
              set -euo pipefail

              deploy_path="$DEPLOY_PATH"
              compose_candidates=(docker-compose.yml docker-compose.yaml compose.yml compose.yaml)
              compose_file=""

              if [[ ! -d "$deploy_path" ]]; then
                echo "Remote deploy path validation failed: the directory configured by the deploy-path secret does not exist on host $(hostname)." >&2
                echo "Verify the branch-to-environment mapping and confirm the secret value points to an existing directory on the server." >&2
                exit 1
              fi

              cd "$deploy_path"
              for candidate in "${compose_candidates[@]}"; do
                if [[ -f "$candidate" ]]; then
                  compose_file="$candidate"
                  break
                fi
              done

              if [[ -z "$compose_file" ]]; then
                echo "Remote deploy path validation failed: no Docker Compose file was found in the deploy directory." >&2
                echo "Expected one of: ${compose_candidates[*]}" >&2
                exit 1
              fi

              echo "Validated remote deploy directory and compose file: $compose_file"
              docker compose -f "$compose_file" pull
              docker compose -f "$compose_file" up -d
              docker compose -f "$compose_file" ps
            '
