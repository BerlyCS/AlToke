name: Production E2E

on:
  workflow_run:
    workflows: [CI / CD]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify-production:
    name: Verify deployed production image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-e2e
      cancel-in-progress: false
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start isolated E2E environment
        run: docker compose -f docker-compose.e2e.yml up --detach --wait --wait-timeout 180

      - name: Run production smoke test
        id: smoke
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://altoke.qzz.io/
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://altoke.qzz.io/api/health

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Cypress against isolated production images
        id: cypress
        continue-on-error: true
        working-directory: frontend
        env:
          CYPRESS_baseUrl: http://localhost:8080
        run: bun run test:e2e:ci

      - name: Build portable E2E report
        if: always()
        env:
          E2E_TESTED_URL: http://localhost:8080
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p e2e-report/junit e2e-report/cypress
          if [[ -d e2e-results ]]; then cp -R e2e-results/. e2e-report/junit/; fi
          if [[ -d frontend/cypress/screenshots ]]; then cp -R frontend/cypress/screenshots e2e-report/cypress/; fi
          if [[ -d frontend/cypress/videos ]]; then cp -R frontend/cypress/videos e2e-report/cypress/; fi
          node scripts/generate-e2e-report.mjs e2e-report e2e-report/index.html

      - name: Upload GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-${{ github.event.workflow_run.head_sha }}
          path: e2e-report
          retention-days: 30
          if-no-files-found: error

      - name: Configure SSH agent for report publishing
        if: always()
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Publish report and remove expired runs
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REPORT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run_name="$(date -u +%Y%m%dT%H%M%SZ)-${REPORT_SHA:0:12}"
          reports_root="/home/altoke/altoke/test-reports"
          report_dir="$reports_root/runs/$run_name"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh "altoke@$SSH_HOST" "mkdir -p '$report_dir' '$reports_root/runs'"
          rsync -az --delete e2e-report/ "altoke@$SSH_HOST:$report_dir/"
          ssh "altoke@$SSH_HOST" "find '$reports_root/runs' -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +"

      - name: Stop isolated E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans

      - name: Mark verification failure
        if: always()
        run: |
          if [[ "${{ steps.smoke.outcome }}" != "success" || "${{ steps.cypress.outcome }}" != "success" ]]; then
            exit 1
          fi
